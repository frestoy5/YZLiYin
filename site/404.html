<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>
<title>404 — 音之理音</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root{ --brand:#3A6BFF; --brand2:#7C5CFF; --ink:#1B1B21; --muted:#5f6069; --bg:#FBF8FF; }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#E4E1E9; --muted:#C7C5D0; --bg:#0E0F13; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
    padding:32px 20px; background:var(--bg); color:var(--ink);
    font-family:"Roboto","HarmonyOS Sans SC","MiSans","Noto Sans SC","Noto Sans JP",
      system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .box{ max-width:520px; }
  img{ width:76px; height:76px; border-radius:20px; margin:0 auto 24px;
       box-shadow:0 8px 26px rgba(46,84,220,.28); }
  h1{ font-size:clamp(56px,14vw,104px); margin:0; font-weight:800; letter-spacing:-.03em;
      background:linear-gradient(96deg,#4285F4,#7C5CFF 55%,#EA4335);
      -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1; }
  p{ color:var(--muted); font-size:16px; line-height:1.7; margin:18px 0 30px; }
  .btns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:12px 24px; min-height:46px;
    border-radius:999px; font-size:15px; font-weight:600; text-decoration:none;
    transition:transform .18s cubic-bezier(.2,0,0,1), box-shadow .2s;
  }
  .btn:active{ transform:scale(.97); }
  .btn--f{ background:var(--brand); color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .btn--o{ border:1px solid #767680; color:var(--brand); }
  .lang{ margin-top:34px; font-size:13.5px; color:var(--muted); }
  .lang a{ margin:0 7px; text-decoration:none; border-bottom:1px solid transparent; }
  .lang a:hover{ color:var(--brand); border-color:var(--brand); }
</style>
</head>
<body>
  <div class="box">
    <img src="assets/logo.svg" alt="音之理音">
    <h1>404</h1>

    <p id="msg">
      这一页没有声音。你要找的内容可能已被移动或从未存在过——回到首页继续听吧。
    </p>

    <div class="btns">
      <a class="btn btn--f" href="./">返回首页</a>
      <a class="btn btn--o" href="https://github.com/frestoy5/YZLiYin" target="_blank" rel="noopener">GitHub</a>
    </div>

    <p class="lang">
      <a href="#" onclick="setLang('zh');return false;">简体中文</a>·
      <a href="#" onclick="setLang('en');return false;">English</a>·
      <a href="#" onclick="setLang('ja');return false;">日本語</a>
    </p>
  </div>

<script>
var T = {
  zh:{ t:'404 — 音之理音', m:'这一页没有声音。你要找的内容可能已被移动或从未存在过——回到首页继续听吧。', b:'返回首页' },
  en:{ t:'404 — YZLiYin', m:"This page made no sound. What you're looking for may have moved or never existed — head back to the home page and keep listening.", b:'Back to home' },
  ja:{ t:'404 — 音之理音', m:'このページには音がありません。お探しのページは移動したか、存在しない可能性があります。ホームに戻って聴き続けましょう。', b:'ホームへ戻る' }
};
function setLang(code){
  var d = T[code] || T.zh;
  document.title = d.t;
  document.getElementById('msg').textContent = d.m;
  document.querySelector('.btn--f').textContent = d.b;
  try{ localStorage.setItem('yzliyin-lang', code); }catch(e){}
}
try{
  var saved = localStorage.getItem('yzliyin-lang');
  if(saved && T[saved]) setLang(saved);
}catch(e){}
</script>
</body>
</html>
